<title>Active Rig Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* Layout: slim header, filter bar, projected basemap on the left, operator ranking / rig detail rail on the right. */
:root {
  --bg: #EDEFEA;
  --panel: #F8F9F6;
  --land: #FBFCF9;
  --ocean: #DDE7E8;
  --line: #B4BEB8;
  --rule: #D6DCD7;
  --ink: #17201D;
  --muted: #5A6862;
  --accent: #0E6B63;
  --accent-ink: #FFFFFF;
  --oil: #C4470B;
  --gas: #1F63B0;
  --og: #7C3F9E;
  --other: #6B7771;
  --warn-bg: #FBEFD5;
  --warn-ink: #6B4A00;
  --ok-bg: #DDF0E6;
  --ok-ink: #0F5A38;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1413; --panel: #141C1A; --land: #1F2B29; --ocean: #0B1110; --line: #3B4D49; --rule: #26332F;
    --ink: #E7EEEA; --muted: #93A39D; --accent: #4FC4B6; --accent-ink: #062622;
    --oil: #F08A4B; --gas: #6FA8E8; --og: #BC8DE3; --other: #8A9791;
    --warn-bg: #3A2F12; --warn-ink: #F3D58A; --ok-bg: #12331F; --ok-ink: #9ADDB8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1413; --panel: #141C1A; --land: #1F2B29; --ocean: #0B1110; --line: #3B4D49; --rule: #26332F;
  --ink: #E7EEEA; --muted: #93A39D; --accent: #4FC4B6; --accent-ink: #062622;
  --oil: #F08A4B; --gas: #6FA8E8; --og: #BC8DE3; --other: #8A9791;
  --warn-bg: #3A2F12; --warn-ink: #F3D58A; --ok-bg: #12331F; --ok-ink: #9ADDB8;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; gap: 10px; min-height: 0; }

.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 20px; }
.head h1 { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: .01em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.head .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.head .meta b { color: var(--ink); font-weight: 600; }

.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { min-width: 0; }
.bar input[type=search], .bar select { height: 34px; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 0 10px; min-width: 0; }
.bar input[type=search] { width: 220px; max-width: 100%; }
.bar select { max-width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 11px; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; font-size: 13px; white-space: nowrap; }
.chip[aria-pressed="false"] { opacity: .5; background: transparent; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; }
.chip em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
.linkbtn { background: none; border: 0; color: var(--accent); padding: 4px 6px; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn[hidden] { display: none; }

.main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; }
.mapwrap { position: relative; min-height: 0; min-width: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--ocean); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.land { fill: var(--land); stroke: var(--line); stroke-width: .6; vector-effect: non-scaling-stroke; }
.land.c-MX { fill: color-mix(in srgb, var(--land) 70%, var(--ocean)); }
.dot { stroke: var(--panel); stroke-width: .7; cursor: pointer; fill-opacity: .9; }
.dot.f-oil { fill: var(--oil); } .dot.f-gas { fill: var(--gas); } .dot.f-og { fill: var(--og); } .dot.f-other { fill: var(--other); }
.dot.off { display: none; }
.dot.dim { fill-opacity: .25; stroke-opacity: .25; }
.dot.sel { stroke: var(--ink); stroke-width: 2; fill-opacity: 1; }
.zoomctl { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--panel); }
.zoomctl button { width: 34px; height: 34px; border: 0; background: transparent; font-size: 18px; line-height: 1; }
.zoomctl button + button { border-top: 1px solid var(--rule); }
.zoomctl button.txt { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 4px 8px; border-radius: 3px; font-size: 12px; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); z-index: 3; }
.tip[hidden] { display: none; }
.hint { position: absolute; left: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; font-size: 12px; color: var(--muted); max-width: calc(100% - 20px); }

.rail { min-height: 0; min-width: 0; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px 18px; }
.rail h2 { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.05; letter-spacing: .01em; text-transform: uppercase; margin: 0 0 4px; text-wrap: balance; }
.rail h3 { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
.sub { color: var(--muted); font-size: 13px; margin: 0; }
.oplist { list-style: none; margin: 0; padding: 0; }
.oplist button { width: 100%; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 7px 2px 6px; position: relative; }
.oplist button:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.oplist .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oplist .ct { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.oplist .bar2 { grid-column: 1 / -1; height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.oplist .bar2 span { display: block; height: 100%; background: var(--accent); }
.oplist button[aria-pressed="true"] .nm { font-weight: 600; }
.back { margin: -4px 0 10px -6px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 99px; font-size: 12px; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
dl.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; overflow-wrap: anywhere; }
.mono { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.card { border: 1px solid var(--line); border-radius: 5px; padding: 11px 12px; background: var(--bg); }
.card .lbl { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.card address { font-style: normal; user-select: text; }
.card .row { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; align-items: center; }
.card a { color: var(--accent); text-underline-offset: 3px; }
.badge { display: inline-block; margin-top: 9px; padding: 2px 8px; border-radius: 3px; font-size: 12px; }
.badge.ok { background: var(--ok-bg); color: var(--ok-ink); }
.badge.warn { background: var(--warn-bg); color: var(--warn-ink); }
.copy { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 2px 9px; font-size: 12px; }
.links { display: flex; flex-direction: column; gap: 6px; }
.links a { display: block; padding: 8px 11px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); text-decoration: none; background: var(--bg); }
.links a:hover { border-color: var(--accent); }
.links a small { display: block; color: var(--muted); font-size: 12px; }
.regions { display: flex; flex-wrap: wrap; gap: 6px; }
.regions span { padding: 2px 8px; border-radius: 3px; background: var(--bg); border: 1px solid var(--rule); font-size: 12px; font-variant-numeric: tabular-nums; }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .mapwrap { height: 62vh; min-height: 360px; }
  .rail { overflow: visible; }
  .bar input[type=search] { width: 100%; }
  .head h1 { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="head">
    <h1>Active Rig Map</h1>
    <div class="meta" id="meta"></div>
  </header>

  <div class="bar" id="bar">
    <input type="search" id="q" placeholder="Search operator or API/UWI" aria-label="Search operator or API/UWI" autocomplete="off">
    <span id="chips" style="display:contents"></span>
    <select id="traj" aria-label="Trajectory"></select>
    <select id="region" aria-label="State or province"></select>
    <button class="linkbtn" id="clear" hidden>Clear filters</button>
  </div>

  <div class="main">
    <div class="mapwrap" id="mapwrap">
      <svg id="map" role="img" aria-label="Map of active drilling rigs in North America"></svg>
      <div class="zoomctl">
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="zout" aria-label="Zoom out">&minus;</button>
        <button id="zreset" class="txt" aria-label="Reset view">All</button>
      </div>
      <div class="tip" id="tip" hidden></div>
      <div class="hint" id="hint">Click a rig for the operator and contact. Scroll or pinch to zoom.</div>
    </div>
    <aside class="rail" id="rail" aria-live="polite"></aside>
  </div>
</div>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('en-US');
const ACR = /\b(LLC|LP|LTD|LLP|INC|BP|EOG|EQT|SM|TG|XTO|CNRL|II|III)\b/i;
const titleCase = (s) => s.toLowerCase().replace(/(^|[\s(\-\/&.])([a-z])/g, (m, a, b) => a + b.toUpperCase())
  .split(' ').map((w) => (ACR.test(w) && w.replace(/[^A-Za-z]/g, '').length <= 4 ? w.toUpperCase() : w)).join(' ');
const fluid = (t) => (t === 'OIL' ? 'oil' : t === 'GAS' ? 'gas' : t === 'OIL & GAS' ? 'og' : 'other');
const FL = { oil: 'Oil', gas: 'Gas', og: 'Oil & gas', other: 'Other' };
const cvar = { oil: 'var(--oil)', gas: 'var(--gas)', og: 'var(--og)', other: 'var(--other)' };
const tcase = (s) => s.charAt(0) + s.slice(1).toLowerCase();

// rig = [api, operator, wellType, trajectory, lat, lon, region]
const S = { types: new Set(['oil', 'gas', 'og', 'other']), traj: '', region: '', op: '', q: '', sel: -1 };
const F = RIGS.map((r) => fluid(r[2]));
const opTotals = {};
RIGS.forEach((r) => { opTotals[r[1]] = (opTotals[r[1]] || 0) + 1; });

function vis(i) {
  const r = RIGS[i];
  if (!S.types.has(F[i])) return false;
  if (S.traj && r[3] !== S.traj) return false;
  if (S.region && r[6] !== S.region) return false;
  if (S.op && r[1] !== S.op) return false;
  if (S.q) { const q = S.q.toLowerCase(); if (!r[1].toLowerCase().includes(q) && !String(r[0]).toLowerCase().includes(q)) return false; }
  return true;
}

/* ---------- map ---------- */
const svg = d3.select('#map');
const gAll = svg.append('g');
const gLand = gAll.append('g');
const gRigs = gAll.append('g');
let W = 0, H = 0, K = 1, proj, zoom, PX = [];

function build() {
  const box = $('mapwrap').getBoundingClientRect();
  W = Math.max(280, box.width); H = Math.max(240, box.height);
  svg.attr('viewBox', `0 0 ${W} ${H}`);
  proj = d3.geoAlbers().rotate([96, 0]).center([0, 38]).parallels([29.5, 45.5]);
  const pts = { type: 'MultiPoint', coordinates: RIGS.filter((r) => !(r[4] > 58 && r[5] < -125)).map((r) => [r[5], r[4]]) };
  proj.fitExtent([[26, 26], [W - 26, H - 26]], pts);
  const path = d3.geoPath(proj);
  gLand.selectAll('path').data(GEO.features).join('path').attr('class', (d) => 'land c-' + d.properties.c).attr('d', path);
  PX = RIGS.map((r) => proj([r[5], r[4]]));
  gRigs.selectAll('circle').data(RIGS.map((_, i) => i), (d) => d).join('circle')
    .attr('cx', (i) => PX[i][0]).attr('cy', (i) => PX[i][1])
    .on('pointerenter', (e, i) => showTip(e, i)).on('pointermove', (e, i) => showTip(e, i))
    .on('pointerleave', () => { $('tip').hidden = true; })
    .on('click', (e, i) => { e.stopPropagation(); select(i); });
  zoom = d3.zoom().scaleExtent([1, 60])
    .translateExtent([[-W * 0.6, -H * 0.6], [W * 1.6, H * 1.6]])
    .on('zoom', (e) => { K = e.transform.k; gAll.attr('transform', e.transform); styleDots(); });
  svg.call(zoom).on('dblclick.zoom', null);
  svg.call(zoom.transform, d3.zoomIdentity);
  styleDots();
}

function styleDots() {
  const k = Math.pow(K, 0.55);
  gRigs.selectAll('circle')
    .attr('class', (i) => {
      let c = 'dot f-' + F[i];
      if (!vis(i)) c += ' off';
      else if (S.sel >= 0 && i === S.sel) c += ' sel';
      else if (S.sel >= 0 && RIGS[i][1] !== RIGS[S.sel][1]) c += ' dim';
      return c;
    })
    .attr('r', (i) => (i === S.sel ? 7.5 : S.sel >= 0 && RIGS[i][1] === RIGS[S.sel][1] ? 5 : 3.6) / k);
  gRigs.selectAll('circle.sel').raise();
}

function showTip(e, i) {
  const t = $('tip'); const b = $('mapwrap').getBoundingClientRect();
  t.textContent = titleCase(RIGS[i][1]);
  t.style.left = Math.min(Math.max(e.clientX - b.left, 60), b.width - 60) + 'px';
  t.style.top = (e.clientY - b.top) + 'px';
  t.hidden = false;
}

$('zin').onclick = () => svg.transition().duration(200).call(zoom.scaleBy, 1.7);
$('zout').onclick = () => svg.transition().duration(200).call(zoom.scaleBy, 1 / 1.7);
$('zreset').onclick = () => svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity);
svg.on('click', () => { if (S.sel >= 0) select(-1); });

/* ---------- filters ---------- */
function buildFilters() {
  const counts = { oil: 0, gas: 0, og: 0, other: 0 };
  F.forEach((f) => counts[f]++);
  $('chips').innerHTML = Object.keys(FL).map((k) =>
    `<button class="chip" data-t="${k}" aria-pressed="true" style="--c:${cvar[k]}"><i></i>${FL[k]} <em>${counts[k]}</em></button>`).join('');
  $('chips').querySelectorAll('button').forEach((b) => b.onclick = () => {
    const k = b.dataset.t;
    if (S.types.has(k)) S.types.delete(k); else S.types.add(k);
    b.setAttribute('aria-pressed', S.types.has(k));
    refresh();
  });
  const tj = {}; RIGS.forEach((r) => { tj[r[3]] = (tj[r[3]] || 0) + 1; });
  $('traj').innerHTML = '<option value="">All trajectories</option>' + Object.entries(tj).sort((a, b) => b[1] - a[1])
    .map(([k, n]) => `<option value="${esc(k)}">${esc(tcase(k))} (${n})</option>`).join('');
  const rg = {}; RIGS.forEach((r) => { const k = r[6]; rg[k] = (rg[k] || 0) + 1; });
  $('region').innerHTML = '<option value="">All states and provinces</option>' + Object.entries(rg).sort((a, b) => b[1] - a[1])
    .map(([k, n]) => `<option value="${esc(k)}">${esc(k)} (${n})</option>`).join('');
  $('traj').onchange = (e) => { S.traj = e.target.value; refresh(); };
  $('region').onchange = (e) => { S.region = e.target.value; refresh(); };
  $('q').oninput = (e) => { S.q = e.target.value.trim(); refresh(); };
  $('clear').onclick = () => {
    S.types = new Set(Object.keys(FL)); S.traj = ''; S.region = ''; S.op = ''; S.q = '';
    $('q').value = ''; $('traj').value = ''; $('region').value = '';
    $('chips').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', 'true'));
    refresh();
  };
}

function refresh() {
  if (S.sel >= 0 && !vis(S.sel)) S.sel = -1;
  const any = S.traj || S.region || S.op || S.q || S.types.size < 4;
  $('clear').hidden = !any;
  styleDots(); renderRail(); renderMeta();
}

function renderMeta() {
  let n = 0; const ops = new Set();
  for (let i = 0; i < RIGS.length; i++) if (vis(i)) { n++; ops.add(RIGS[i][1]); }
  $('meta').innerHTML = `<b>${nf.format(n)}</b> of ${nf.format(RIGS.length)} rigs &middot; <b>${nf.format(ops.size)}</b> operators &middot; data as of 10/14/2026`;
}

/* ---------- rail ---------- */
function select(i) { S.sel = i; styleDots(); renderRail(); $('rail').scrollTop = 0; if (i >= 0 && window.matchMedia('(max-width: 860px)').matches) $('rail').scrollIntoView({ behavior: 'smooth', block: 'start' }); }

function renderRail() { S.sel >= 0 ? renderDetail(S.sel) : renderOverview(); }

function renderOverview() {
  const c = {}; let n = 0;
  for (let i = 0; i < RIGS.length; i++) if (vis(i)) { c[RIGS[i][1]] = (c[RIGS[i][1]] || 0) + 1; n++; }
  const list = Object.entries(c).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const top = list.slice(0, 40); const max = top.length ? top[0][1] : 1;
  const act = S.op && !c[S.op] ? `<li><button data-op="${esc(S.op)}" aria-pressed="true"><span class="nm">${esc(titleCase(S.op))}</span><span class="ct">0</span></button></li>` : '';
  $('rail').innerHTML = `
    <h2>Who is drilling</h2>
    <p class="sub">${n ? 'Pick an operator to isolate its rigs, or click any rig on the map.' : 'No rigs match these filters.'}</p>
    <h3>Operators by rig count${list.length > top.length ? ` (top ${top.length} of ${nf.format(list.length)})` : ''}</h3>
    <ul class="oplist">${act}${top.map(([o, k]) => `
      <li><button data-op="${esc(o)}" aria-pressed="${S.op === o}">
        <span class="nm">${esc(titleCase(o))}</span><span class="ct">${k}</span>
        <span class="bar2"><span style="width:${(k / max * 100).toFixed(1)}%"></span></span></button></li>`).join('')}
    </ul>`;
  $('rail').querySelectorAll('[data-op]').forEach((b) => b.onclick = () => { S.op = S.op === b.dataset.op ? '' : b.dataset.op; refresh(); });
}

function renderDetail(i) {
  const r = RIGS[i]; const op = r[1]; const d = DIR[op]; const f = F[i];
  const reg = r[6]; const total = opTotals[op];
  const byReg = {}; RIGS.forEach((x) => { if (x[1] === op) byReg[x[6]] = (byReg[x[6]] || 0) + 1; });
  const regs = Object.entries(byReg).sort((a, b) => b[1] - a[1]);
  const name = titleCase(op);
  const maps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + ' office near ' + r[4] + ',' + r[5])}`;

      <span class="badge ${d.v ? 'ok' : 'warn'}">${d.v ? 'Checked: ' + esc(d.s) : 'Entered from general knowledge. Confirm before using.'}</span>

    <div class="pills">
      <span class="pill" style="--c:${cvar[f]}"><i></i>${esc(tcase(r[2]))}</span>

    <h3>Contact</h3>

    <div class="links">

      <a href="${web}" target="_blank" rel="noopener noreferrer">${esc(name)} field office in ${esc(reg || 'the Gulf')}<small>Web search for address and phone</small></a>

  $('back').onclick = () => select(-1);
  const cb = $('copy');
  if (cb) cb.onclick = async () => {

document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sel >= 0) select(-1); });
